name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile and test
        env:
          DINGDING_ME_AGENT_HOME: ${{ runner.temp }}/dingding-me-agent
        run: make check
      - name: Validate sample configuration
        env:
          DINGDING_ME_AGENT_HOME: ${{ runner.temp }}/dingding-me-agent
        run: make config-check
