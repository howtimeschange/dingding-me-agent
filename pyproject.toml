[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dingding-me-agent"
version = "0.1.0"
description = "Guarded DingTalk group-message agent using DWS and optional Codex sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DingTalk Real AI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
dingding-me-agent = "dingding_me_agent.worker:main"
dingding-me-agent-config = "dingding_me_agent.config_tui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
